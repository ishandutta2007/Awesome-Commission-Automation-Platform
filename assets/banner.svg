<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dashOffset {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .glow-circle { animation: pulseGlow 6s infinite ease-in-out; transform-origin: center; }
    .floating-card-1 { animation: floatCard 5s infinite ease-in-out; }
    .floating-card-2 { animation: floatCard 7s infinite ease-in-out 1s; }
    .animated-path { stroke-dasharray: 10, 10; animation: dashOffset 20s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Dynamic Background Elements (Behind Content) -->
  <circle cx="150" cy="80" r="180" fill="#38bdf8" opacity="0.08" class="glow-circle" />
  <circle cx="1050" cy="240" r="220" fill="#c084fc" opacity="0.08" class="glow-circle" />

  <!-- Grid Pattern -->
  <path d="M0,40 L1200,40 M0,80 L1200,80 M0,120 L1200,120 M0,160 L1200,160 M0,200 L1200,200 M0,240 L1200,240 M0,280 L1200,280" stroke="url(#gridGrad)" stroke-width="1"/>

  <!-- Geometric Decorative Lines in Background -->
  <path d="M 800 280 Q 950 120 1150 160" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.3" class="animated-path" />
  <path d="M 850 290 Q 1000 130 1200 170" stroke="#c084fc" stroke-width="1.5" fill="none" opacity="0.2" class="animated-path" />

  <!-- Background Stats/Pills (Positioned away from text) -->
  <g class="floating-card-1" transform="translate(860, 50)">
    <rect width="260" height="70" rx="12" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#0284c7" opacity="0.3"/>
    <text x="35" y="40" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#38bdf8">⚡</text>
    <text x="70" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Automated Payouts</text>
    <text x="70" y="50" font-family="sans-serif" font-size="12" fill="#94a3b8">Real-time RevOps Sync</text>
  </g>

  <g class="floating-card-2" transform="translate(890, 160)">
    <rect width="240" height="70" rx="12" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#7c3aed" opacity="0.3"/>
    <text x="35" y="40" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c084fc">📊</text>
    <text x="70" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Quota Attainment</text>
    <text x="70" y="50" font-family="sans-serif" font-size="12" fill="#94a3b8">Auditable Rules &amp; Tier Splits</text>
  </g>

  <!-- Main Content Foreground (Guaranteed Unobscured Title & Subtitle) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Category -->
    <g transform="translate(0, 65)">
      <rect width="270" height="32" rx="16" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
      <text x="135" y="21" text-anchor="middle" class="badge-text">🚀 REVENUE OPERATIONS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title" filter="url(#glow)">Awesome Commission Automation</text>

    <!-- Subtitle -->
    <text x="0" y="188" class="subtitle">Curated SaaS Platforms &amp; Open-Source Engines for Sales Compensation</text>

    <!-- Key Feature Badges -->
    <g transform="translate(0, 225)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="82" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">💡 Sales Compensation</text>

      <!-- Badge 2 -->
      <rect x="177" y="0" width="165" height="30" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <text x="259" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#818cf8">📈 Quota Attainment</text>

      <!-- Badge 3 -->
      <rect x="354" y="0" width="165" height="30" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
      <text x="436" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc">🔓 Open-Source Engines</text>
    </g>
  </g>
</svg>
